name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOMAIN: 'hispalance.com'
  EC2_HOST: '18.234.56.226'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      # ===========================================
      # 1. Checkout y Setup
      # ===========================================
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ===========================================
      # 2. Publish proyectos (.NET 10)
      # ===========================================
      - name: Publish SignalR
        run: |
          set -euo pipefail
          dotnet publish src/01.Apis/MemoryOnline.Apis.Signalr/MemoryOnline.Apis.Signalr.csproj \
            -c Release \
            -f net10.0 \
            -o ./publish/signalr

      - name: Publish WebApi
        run: |
          set -euo pipefail
          dotnet publish src/01.Apis/MemoryOnline.Apis.WebApi/MemoryOnline.Apis.WebApi.csproj \
            -c Release \
            -f net10.0 \
            -o ./publish/webapi

      # ===========================================
      # 3. Build imágenes Docker (ARM64 + .NET 10)
      # ===========================================
      - name: Build Docker image - SignalR
        run: |
          cd ./publish/signalr
          echo "FROM mcr.microsoft.com/dotnet/aspnet:10.0" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY . ." >> Dockerfile
          echo "EXPOSE 8080" >> Dockerfile
          echo 'ENTRYPOINT ["dotnet", "MemoryOnline.Apis.Signalr.dll"]' >> Dockerfile
          docker build --platform linux/arm64 -t memoryonline-signalr:latest .

      - name: Build Docker image - WebApi
        run: |
          cd ./publish/webapi
          echo "FROM mcr.microsoft.com/dotnet/aspnet:10.0" > Dockerfile
          echo "WORKDIR /app" >> Dockerfile
          echo "COPY . ." >> Dockerfile
          echo "EXPOSE 8080" >> Dockerfile
          echo 'ENTRYPOINT ["dotnet", "MemoryOnline.Apis.WebApi.dll"]' >> Dockerfile
          docker build --platform linux/arm64 -t memoryonline-webapi:latest .

      # ===========================================
      # >. Construir imagen de Otel Collector (Custom con config)
      # ===========================================
      # - name: Build Docker image - OtelCollector
      #   run: |
      #     mkdir -p ./otel
      #     cp docker/otel-collector-config.yml ./otel/
      #     cd ./otel
      #     echo "FROM otel/opentelemetry-collector:latest" > Dockerfile
      #     echo "COPY otel-collector-config.yml /etc/otel-collector-config.yml" >> Dockerfile
      #     echo 'CMD ["--config=/etc/otel-collector-config.yml"]' >> Dockerfile
      #     docker build --platform linux/arm64 -t memoryonline-otel:latest .

      # ===========================================
      # 4. Exportar imágenes
      # ===========================================
      - name: Exportar imágenes Docker
        run: |
          docker save memoryonline-signalr:latest | gzip > signalr-image.tar.gz
          docker save memoryonline-webapi:latest | gzip > webapi-image.tar.gz
          # docker save memoryonline-otel:latest | gzip > otel-image.tar.gz
          
      # ===========================================
      # 5. Configurar SSH
      # ===========================================
      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ env.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # ===========================================
      # 6. Preparar variables de entorno para el deploy
      # ===========================================
      - name: Crear archivo .env para el deploy
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          MONGO_CONNECTION_STRING: ${{ secrets.MONGOCONNECTIONSTRING }}
          DOMAIN: ${{ env.DOMAIN }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          : "${EC2_USER:?EC2_USER secret is required}"
          cat > deploy.env <<EOF
          CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN}
          MONGO_CONNECTION_STRING=${MONGO_CONNECTION_STRING}
          DOMAIN=${DOMAIN}
          EC2_USER=${EC2_USER}
          EOF
          echo "🔐 Longitudes: CLOUDFLARE_TOKEN=${#CLOUDFLARE_TOKEN} MONGO=${#MONGO_CONNECTION_STRING}"
          echo "✅ Archivo deploy.env generado"

      # ===========================================
      # 7. Copiar archivos a EC2
      # ===========================================
      - name: Copiar archivos a EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ env.EC2_HOST }}
        run: |
          set -euo pipefail
          : "${EC2_USER:?EC2_USER secret is required}"
          echo "📤 Subiendo archivos a /home/$EC2_USER/ ..."
          scp signalr-image.tar.gz "$EC2_USER@$EC2_HOST:/home/$EC2_USER/"
          scp webapi-image.tar.gz "$EC2_USER@$EC2_HOST:/home/$EC2_USER/"
          scp deploy.env "$EC2_USER@$EC2_HOST:/home/$EC2_USER/.env"
          # scp otel-image.tar.gz "$EC2_USER@$EC2_HOST:/home/$EC2_USER/"
          scp .github/scripts/deploy.sh "$EC2_USER@$EC2_HOST:/home/$EC2_USER/"
          echo "✅ Archivos subidos"

      # ===========================================
      # 8. Ejecutar deploy en EC2
      # ===========================================
      - name: Ejecutar deploy
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ env.EC2_HOST }}
        run: |
          set -euo pipefail
          : "${EC2_USER:?EC2_USER secret is required}"
          ssh "$EC2_USER@$EC2_HOST" bash -s "$EC2_USER" <<'ENDSSH'
            set -euo pipefail
            REMOTE_USER="$1"
            ENV_FILE="/home/$REMOTE_USER/.env"
            if [ -f "$ENV_FILE" ]; then
              set -a
              source "$ENV_FILE"
              set +a
              rm -f "$ENV_FILE"
            fi
            : "${EC2_USER:?EC2_USER secret is required in .env}"
            cd "/home/$EC2_USER"
            chmod +x deploy.sh
            ./deploy.sh
          ENDSSH

      # ===========================================
      # 8. Verificación final
      # ===========================================
      - name: Verificar deploy
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ env.EC2_HOST }}
        run: |
          set -euo pipefail
          echo "🔍 Verificando servicios..."
          ssh "$EC2_USER@$EC2_HOST" "sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
