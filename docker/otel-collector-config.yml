receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Exportador OTLP hacia Grafana Cloud usando HTTP estándar (por puerto 443 para evitar bloqueos)
  otlphttp/grafanacloud:
    endpoint: "${GRAFANA_ENDPOINT}"
    headers:
      Authorization: "Basic ${GRAFANA_CLOUD_TOKEN}"

  # Por defecto no enviamos trazas a ningún lado ya que Tempo está en local 
  # pero si tuvieras una IP pública de tu local aquí iría
  otlp_grpc/tempo:
    endpoint: "host.docker.internal:4317"
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: "http://host.docker.internal:3100/otlp"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud] 
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafanacloud]
