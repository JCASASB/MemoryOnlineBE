apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: memoryonline
type: Opaque
stringData:
  username: admin
  password: CHANGE_ME
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: memoryonline
spec:
  clusterIP: None
  selector: { app: mongodb }
  ports: [{ name: mongodb, port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: memoryonline
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      initContainers:
        - name: create-keyfile
          image: busybox:1.36
          command: ["sh", "-c", "head -c 756 /dev/urandom | base64 | tr -d '\\n' > /keyfile/keyfile && chmod 400 /keyfile/keyfile && chown 999:999 /keyfile/keyfile"]
          volumeMounts: [{ name: keyfile, mountPath: /keyfile }]
      containers:
        - name: mongodb
          image: mongo:8.0
          args: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile/keyfile"]
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: password } }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: keyfile, mountPath: /etc/mongo-keyfile }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-replica-set-init
  namespace: memoryonline
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:8.0
          command: ["sh", "-c", "until mongosh \"mongodb://$MONGO_USER:$MONGO_PASSWORD@mongodb-0.mongodb:27017/admin\" --quiet --eval \"db.adminCommand('ping').ok\"; do sleep 3; done; mongosh \"mongodb://$MONGO_USER:$MONGO_PASSWORD@mongodb-0.mongodb:27017/admin\" --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb-0.mongodb:27017\"}]}) }'"]
          env:
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: username } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-credentials, key: password } }
